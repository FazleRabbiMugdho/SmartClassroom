; FastRobox 1.0 firmware — PlatformIO project for the ESP32-S3-WROOM CAM (N16R8).
; Build:  pio run -e esp32s3
; Upload: pio run -e esp32s3 -t upload   (the board's USB-UART port, CH343)

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
upload_port = COM3
monitor_port = COM3
board_build.flash_mode = qio
; N16R8 module: 16 MB flash and 8 MB octal PSRAM. Without this line free PSRAM shows psram=0k.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
; 16 MB partition layout: the program and the web-page storage (LittleFS) must use the same offsets.
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
; Team ID is not a secret. Change it here (for example T07) or pass -DTEAM_ID=\"T07\" on the command line.
build_flags =
    -Isrc
    -DBOARD_HAS_PSRAM
    -DTEAM_ID=\"T01\"
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19

; Wokwi reads the build products; wokwi/wokwi.toml points at these paths.
